[package]
name = "onion-peel"
version = "1.0.0"
edition = "2021"
description = "Win+Shift+S region snip to the clipboard. No window, no tray icon, no history, no network."
authors = ["OnionAlien"]
license = "GPL-3.0-only"
repository = "https://github.com/Onion-Alien/onion-peel"

[features]
# `cargo build --release --features selftest`, then `onion-peel --selftest <dir>`.
selftest = []

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_Security",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
