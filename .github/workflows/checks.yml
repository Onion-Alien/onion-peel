name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the privacy checks read the whole history
          # A PR's own head, never the merge commit GitHub makes to test it: that one is
          # stamped in the account's time zone, and its id would land in this public log.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: No secrets or personal data, in the files and the history
        run: python scripts/check_sensitive.py --history

      - name: Commit times in UTC
        shell: bash
        # (main is fast-forwarded, never merged with GitHub's button: GitHub's merge
        # commits carry the account's time zone)
        run: sh scripts/checks/check_utc.sh HEAD

      - name: Toolchain
        run: rustup component add clippy

      - name: Build
        run: cargo build --release

      - name: Tests
        run: cargo test

      - name: Clippy
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features selftest -- -D warnings

      - name: Self-test build
        run: cargo build --release --features selftest

      - name: Installer
        run: |
          python -m pip install --quiet pillow
          choco install innosetup -y --no-progress
          powershell -File scripts/build-release.ps1
