name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Pinned to a commit (v4), so a moved tag can't change what runs here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0 # the privacy checks read the whole history
          # A PR's own head, never the merge commit GitHub makes to test it: that one is
          # stamped in the account's time zone, and its id would land in this public log.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: No secrets or personal data, in the files and the history
        run: python scripts/check_sensitive.py --history

      - name: Commit times in UTC
        shell: bash
        # (main is fast-forwarded, never merged with GitHub's button: GitHub's merge
        # commits carry the account's time zone)
        run: sh scripts/checks/check_utc.sh HEAD

      - name: Toolchain
        run: rustup component add clippy

      # --locked: exactly the crate versions in Cargo.lock, or the step fails.
      - name: Build
        run: cargo build --release --locked

      - name: Tests
        run: cargo test --locked

      - name: Clippy
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features selftest -- -D warnings

      - name: Self-test build
        run: cargo build --release --locked --features selftest

      - name: Installer
        run: |
          python -m pip install --quiet pillow
          choco install innosetup -y --no-progress
          powershell -File scripts/build-release.ps1 --locked
